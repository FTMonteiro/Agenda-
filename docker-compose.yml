# Agenda+ completo para desenvolvimento: PostgreSQL + API + painel web.
#
#   docker compose up --build
#
# Painel: http://localhost:3001  (conta de exemplo owner@slotix.dev / password123)
# API:    http://localhost:3000/api/v1  (documentação em /api/v1/docs)
#
# Chaves opcionais (Google, Supabase, mapas) vão num ficheiro .env na raiz do projeto;
# ver .env.docker.example. Sem elas tudo funciona menos esses extras.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 5433 para não chocar com um PostgreSQL já instalado no computador.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://agenda:agenda@db:5432/agenda?schema=public
      # Segredos só para desenvolvimento local; em produção usam-se outros.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-0000000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-000000000}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      WEB_URL: http://localhost:3001
      MOBILE_APP_SCHEME: slotix
      APP_TIMEZONE: Africa/Luanda
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-slotix-gallery}
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      NOMINATIM_USER_AGENT: AgendaPlus/1.0
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      OVERPASS_URL: https://overpass-api.de/api/interpreter
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: .
      target: web
      args:
        NEXT_API_URL: http://api:3000/api/v1
        NEXT_APP_URL: http://localhost:3001
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3001}:3001"

volumes:
  db-data:
